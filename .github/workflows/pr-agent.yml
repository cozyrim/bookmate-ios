name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONFIG__MODEL: ${{ vars.PR_AGENT_MODEL || 'gpt-6.1-sol' }}
      CONFIG__FALLBACK_MODELS: '[]'
      CONFIG__LOG_LEVEL: INFO
      # Bootstrap the config from the same-repository PR; comments use main.
      PR_AGENT_CONFIG_BRANCH: ${{ github.event.pull_request.head.ref || github.event.repository.default_branch }}
      GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
      GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
      GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
      GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: 'true'
      GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
    steps:
      - name: Check model credentials
        shell: bash
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo '::error::Add the OPENAI_KEY repository secret before enabling PR Agent.'
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # PR Agent reads the diff through GitHub's API. PR source is not executed.
      - name: Install PR Agent
        run: python -m pip install --disable-pip-version-check 'pr-agent[github]==0.49.0'
      - name: Review pull request
        run: python -m pr_agent.servers.github_action_runner
