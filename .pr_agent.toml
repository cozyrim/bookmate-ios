# PR-Agent 0.49.0. Model credentials are supplied through GitHub Actions secrets.
[config]
response_language = "ko-KR"
publish_output = true
publish_output_progress = false
enable_auto_approval = false
repo_context_files = ["README.md"]
fallback_models = []
max_model_tokens = 24000
max_output_tokens = 3000
ai_timeout = 90
retry_same_model_on_timeout = false
num_retries = 0
log_level = "INFO"

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_estimate_effort_to_review = false
require_security_review = true
require_ticket_analysis_review = false
num_max_findings = 3
inline_key_issues = false
persistent_comment = true
publish_output_no_suggestions = false
enable_review_labels_security = false
enable_review_labels_effort = false
extra_instructions = """
북메이트 iOS 앱의 변경을 검토한다. 제목과 본문은 한국어로 쓴다.
동작 회귀, 사용자별 데이터 분리, 검색 모드별 데이터 분리, 상태 소유권,
MainActor 경계, 취소와 재시도, 기존 저장 키와 JSON 호환성을 우선 검토한다.
반드시 문제를 유발하는 조건과 코드 근거를 제시한다. 추측은 사실처럼 쓰지 않는다.
단순 폴더 이동이나 아키텍처 이름만으로 문제를 만들지 않는다.
private 구현과 동일한 내용을 복제하는 테스트를 요구하지 않는다.
각 발견은 상황, 잘못되는 결과, 원인, 확인 방법 순서로 짧게 설명한다.
실행하지 않은 빌드나 테스트를 통과했다고 쓰지 않는다.
현재 Swift 언어 모드 5.0을 전제로 하며 언어 모드 변경을 요구하는 제안은 별도로 구분한다.
"""

[pr_description]
generate_ai_title = false
publish_labels = false
add_original_user_description = true
extra_instructions = """
문제와 변경 후 동작을 먼저 설명한다. 구현한 내용만 서술한다.
설계 선택 이유와 실제 검증 결과를 짧게 적는다.
긴 학습 설명은 별도 문서로 연결한다. 미실행 테스트와 성능 수치를 만들지 않는다.
"""

[github_action_config]
auto_review = true
auto_describe = false
auto_improve = false

handle_push_trigger = true
push_commands = ["/review"]
